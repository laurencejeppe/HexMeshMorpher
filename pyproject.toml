[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "HexMeshMorpher"
version = "0.0.1"
authors = [
    { name="Laurence Russell", email="l.j.russell@soton.ac.uk" },
]
description = "A tool for mapping uniform hexahedral finite element meshes onto other shapes"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2.5",
    "rtree==1.4.0",
    "scipy>=1.15.2",
    "trimesh==4.6.8",
    "vtk==9.6.2",
]

[project.optional-dependencies]
gui = ["PyQt6"]

[project.urls]
Homepage = "https://github.com/laurencejeppe/HexMeshMopher"
Issues = "http://github.com/laurencejeppe/HexMeshMorpher/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
